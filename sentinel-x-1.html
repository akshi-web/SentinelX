<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENTINEL-X — AI Insider Threat & Autonomous Cyber Defense</title>
<style>
:root{
  --bg:#0a0d12; --panel:#10151c; --panel2:#141a22; --border:#1f2833;
  --txt:#dbe4ec; --sub:#7c8ba1; --accent:#00e5c7; --accent2:#3d7bff;
  --warn:#ffb020; --crit:#ff3b5c; --ok:#2ecf7a;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 15% 0%,#0d1622 0%,#0a0d12 55%);color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#233; border-radius:4px}
a{color:inherit}
.app{display:flex;min-height:100vh}
/* SIDEBAR */
.sidebar{width:230px;background:rgba(16,21,28,.9);border-right:1px solid var(--border);
  padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;backdrop-filter:blur(10px);
  padding-top:calc(20px + env(safe-area-inset-top,0px));z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
.brand .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#04110d;font-size:16px}
.brand h1{font-size:15px;margin:0;letter-spacing:.5px}
.brand p{font-size:10px;color:var(--sub);margin:2px 0 0}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;color:var(--sub);
  text-decoration:none;font-size:13px;margin-bottom:2px;cursor:pointer;border:1px solid transparent}
.nav a svg{width:16px;height:16px;flex-shrink:0}
.nav a:hover{background:#151d27;color:var(--txt)}
.nav a.active{background:linear-gradient(90deg,rgba(0,229,199,.14),transparent);color:var(--accent);border-color:rgba(0,229,199,.25)}
.nav .sec{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#3d4a5c;margin:14px 8px 6px}
/* MAIN */
.main{flex:1;min-width:0;padding:22px 26px 60px;max-width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.topbar h2{margin:0;font-size:20px}
.topbar .desc{color:var(--sub);font-size:12px;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%}
.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.warn{background:var(--warn)}
.dot.crit{background:var(--crit);box-shadow:0 0 6px var(--crit)}
.page{display:none;animation:fade .35s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* CARDS */
.grid{display:grid;gap:14px}
.grid.k6{grid-template-columns:repeat(6,1fr)}
.grid.k4{grid-template-columns:repeat(4,1fr)}
.grid.k3{grid-template-columns:repeat(3,1fr)}
.grid.k2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.grid.k6{grid-template-columns:repeat(3,1fr)}.grid.k4{grid-template-columns:repeat(2,1fr)}.grid.k3{grid-template-columns:repeat(2,1fr)}.grid.k2{grid-template-columns:1fr}}
@media(max-width:640px){.grid.k6,.grid.k4,.grid.k3{grid-template-columns:repeat(2,1fr)}}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:12px;padding:16px}
.kpi .lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px}
.kpi .trend{font-size:11px;margin-top:4px;color:var(--sub)}
.card h3{margin:0 0 12px;font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
/* FLOW */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11px}
.flow span.step{background:#131a23;border:1px solid var(--border);padding:6px 10px;border-radius:7px;color:var(--sub)}
.flow span.arrow{color:#3d4a5c}
/* TABLE / EVENTS */
.evt-filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.evt-filters button{background:var(--panel);border:1px solid var(--border);color:var(--sub);padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer}
.evt-filters button.active{color:#04110d;background:var(--accent);border-color:var(--accent)}
.evtrow{display:grid;grid-template-columns:70px 100px 1.4fr 1fr 90px 90px;gap:10px;align-items:center;
  padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px}
.evtrow.head{color:var(--sub);text-transform:uppercase;font-size:10px;letter-spacing:.5px}
.evtrow.critical{background:rgba(255,59,92,.08);border-left:3px solid var(--crit)}
.evtrow.elevated{border-left:3px solid var(--warn)}
.evtrow.normal{border-left:3px solid transparent}
.badge{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;display:inline-block}
.badge.normal{background:rgba(46,207,122,.15);color:var(--ok)}
.badge.elevated{background:rgba(255,176,32,.15);color:var(--warn)}
.badge.critical{background:rgba(255,59,92,.15);color:var(--crit)}
.scroll{max-height:420px;overflow-y:auto}
/* BUTTONS */
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:9px 16px;border-radius:8px;font-size:12.5px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#3a4a5c}
.btn.primary{background:linear-gradient(90deg,var(--accent),#00b8a0);color:#04110d;border:none}
.btn.danger{background:linear-gradient(90deg,var(--crit),#c2264a);color:#fff;border:none}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* two col */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.cmprow{display:grid;grid-template-columns:120px 1fr 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.cmprow .lab{color:var(--sub)}
.cmprow .cur.flag{color:var(--crit);font-weight:700}
/* risk bars */
.riskrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.riskrow .name{width:190px;color:var(--sub);flex-shrink:0}
.riskbar{flex:1;height:9px;background:#151d27;border-radius:5px;overflow:hidden}
.riskbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--crit));border-radius:5px}
.riskval{width:42px;text-align:right;font-weight:700}
.gauge{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:conic-gradient(var(--crit) calc(var(--pct,92)*1%), #151d27 0);margin:0 auto}
.gauge .inner{width:112px;height:112px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .inner b{font-size:26px}
.gauge .inner span{font-size:10px;color:var(--sub)}
/* timeline */
.tl{position:relative;padding-left:22px;margin-top:8px}
.tl::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tlitem{position:relative;padding-bottom:16px;font-size:12.5px}
.tlitem::before{content:'';position:absolute;left:-22px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg)}
.tlitem.crit::before{background:var(--crit)}
.tlitem b{display:block;margin-bottom:2px}
.tlitem span{color:var(--sub);font-size:11px}
/* incident */
.riskbig{font-size:44px;font-weight:800;color:var(--crit)}
.explain{background:#12181f;border:1px solid var(--border);border-left:3px solid var(--accent2);padding:14px;border-radius:8px;font-size:12.5px;line-height:1.6;color:#c3cddb}
/* audit */
.audrow{display:grid;grid-template-columns:110px 1fr 60px 1fr 130px 100px;gap:10px;padding:9px 10px;border-bottom:1px solid var(--border);font-size:11.5px;align-items:center}
.audrow.head{color:var(--sub);text-transform:uppercase;font-size:10px}
.hashline{font-family:monospace;color:#3d5a52;font-size:10px}
/* users grid */
.userrow{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border);cursor:pointer}
.userrow:hover{background:#121820}
.uinfo{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:#1c2531;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent)}
/* analytics bars */
.barchart{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:10px}
.barchart .b{flex:1;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:4px 4px 0 0;position:relative}
.barchart .b span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9px;color:var(--sub)}
/* hitl */
.hitl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:18px;font-size:11.5px}
.hitl .node{background:#131a23;border:1px solid var(--border);padding:10px 14px;border-radius:9px;text-align:center;min-width:100px}
.hitl .node b{display:block;font-size:12px;color:var(--accent);margin-bottom:2px}
.hitl .arrow{color:#3d4a5c;font-size:16px}
.footnote{font-size:11px;color:#556173;margin-top:8px;font-style:italic}
.tag{font-size:10px;background:#1a2331;color:#6f8296;padding:2px 8px;border-radius:5px;border:1px solid var(--border)}
.demobar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.demolog{font-family:monospace;font-size:11.5px;line-height:1.9;max-height:320px;overflow-y:auto;color:#9db0c4}
.demolog .cur{color:var(--accent);font-weight:700}
.progress-outer{height:6px;background:#151d27;border-radius:3px;overflow:hidden;margin:10px 0}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--accent2),var(--crit));width:0%;transition:width .4s}
select{background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:6px 10px;border-radius:7px;font-size:12px}
.mobtoggle{display:none}
@media(max-width:820px){
  .sidebar{position:fixed;left:-260px;transition:left .25s;z-index:50;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .sidebar.open{left:0}
  .mobtoggle{display:flex;background:var(--panel);border:1px solid var(--border);color:var(--txt);padding:8px 12px;border-radius:8px;cursor:pointer;align-items:center;gap:6px}
  .evtrow{grid-template-columns:60px 1fr 70px}
  .evtrow span:nth-child(3),.evtrow span:nth-child(4),.evtrow span:nth-child(5){display:none}
  .audrow{grid-template-columns:1fr 70px 90px}
  .audrow span:nth-child(2),.audrow span:nth-child(5){display:none}
}
/* LIVE TEST FORM */
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}}
.fgroup label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fgroup input,.fgroup select{width:100%;background:#0d131a;border:1px solid var(--border);color:var(--txt);padding:9px 10px;border-radius:7px;font-size:12.5px}
.fgroup input:focus,.fgroup select:focus{outline:none;border-color:var(--accent)}
.fsection{margin:18px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent2);font-weight:700;border-bottom:1px solid var(--border);padding-bottom:6px}
.scenariobar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.scenbtn{border:1px solid var(--border);background:var(--panel2);padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
.scenbtn.green{color:var(--ok);border-color:rgba(46,207,122,.35)}
.scenbtn.yellow{color:var(--warn);border-color:rgba(255,176,32,.35)}
.scenbtn.red{color:var(--crit);border-color:rgba(255,59,92,.35)}
.factorgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
@media(max-width:900px){.factorgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.factorgrid{grid-template-columns:1fr}}
.factorcard{background:#12181f;border:1px solid var(--border);border-radius:9px;padding:12px;font-size:12px}
.factorcard .ic{font-size:18px;margin-bottom:4px}
.factorcard b{display:block;font-size:12.5px;margin-bottom:5px}
.factorcard .fc-row{color:var(--sub);font-size:11px;line-height:1.6}
.pipeline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10.5px;margin-top:10px}
.pipeline .pnode{background:#131a23;border:1px solid var(--border);padding:6px 10px;border-radius:7px;color:var(--sub)}
.pipeline .pnode.done{color:var(--accent);border-color:rgba(0,229,199,.35);background:rgba(0,229,199,.08)}
.simbanner{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--warn);background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.3);padding:5px 10px;border-radius:7px;margin-bottom:12px}
</style>
</head>

function pad(n){return n<10?'0'+n:n}
function nowTime(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}

function analyzeSession(){
 const t=state.liveTest;
 if(!t.name.trim()||!t.id.trim()){alert('Please enter at least Employee Name and Employee ID.');return;}
 const toMin=s=>{if(!s)return null;const p=s.split(':');return (+p[0])*60+(+p[1]||0);};
 const cur=toMin(t.curLogin),bs=toMin(t.baseStart),be=toMin(t.baseEnd);
 const anomalies=[],factors=[];let risk=5;
 const loginAnom = cur!=null&&bs!=null&&be!=null&&(cur<bs-15||cur>be+15);
 if(loginAnom){anomalies.push('login');risk+=18;factors.push({ic:'🕐',t:'Unusual Login Time',cur:t.curLogin,base:t.baseStart+'–'+t.baseEnd});}
 const deviceAnom = t.curDevice && t.baseDevice && t.curDevice!==t.baseDevice;
 if(deviceAnom){anomalies.push('device');risk+=20;factors.push({ic:'💻',t:'Unknown Device',cur:t.curDevice,base:t.baseDevice});}
 const locAnom = t.curLocation && t.baseLocation && t.curLocation!==t.baseLocation;
 if(locAnom){anomalies.push('location');risk+=15;factors.push({ic:'📍',t:'Location Anomaly',cur:t.curLocation,base:t.baseLocation});}
 const sensitive = SENSITIVE_RESOURCES.includes(t.curResource);
 if(sensitive){anomalies.push('sensitive');risk+=12;factors.push({ic:'🔐',t:'Sensitive Resource Access',cur:t.curResource,base:'—'});}
 const baseDown=parseFloat(t.baseDownload)||0,curDown=parseFloat(t.curDownload)||0;
 let transferAnom=false,dev=0;
 if(baseDown>0&&curDown>baseDown*3){transferAnom=true;dev=+(curDown/baseDown).toFixed(1);anomalies.push('transfer');risk+=Math.min(30,15+dev);
  factors.push({ic:'📦',t:'Large Data Transfer',cur:curDown+' MB',base:baseDown+' MB/day',extra:dev+'× baseline'});}
 const baseAct=parseFloat(t.baseActivity)||0,curAct=parseFloat(t.curActivity)||0;
 let activityAnom=false;
 if(baseAct>0&&curAct>baseAct*1.5){activityAnom=true;anomalies.push('activity');risk+=10;
  factors.push({ic:'📊',t:'Abnormal Activity Volume',cur:curAct+' events',base:baseAct+' events/day'});}
 risk=Math.min(100,Math.round(risk));
 const parts=[];
 if(loginAnom)parts.push('an unusual login time');
 if(deviceAnom)parts.push('a previously unseen device');
 if(locAnom)parts.push('a location mismatch');
 if(sensitive)parts.push('access to a sensitive resource');
 if(transferAnom)parts.push('a significantly elevated data-transfer volume');
 if(activityAnom)parts.push('an abnormal activity volume');
 let explanation;
 if(!parts.length)explanation='The current session shows no meaningful deviation from the supplied behavioural baseline. No anomaly indicators were triggered.';
 else if(parts.length===1)explanation=`The current session deviates from the supplied behavioural baseline in one respect: ${parts[0]}. This raised the prototype risk score to ${risk}/100.`;
 else explanation=`The current session shows multiple deviations from the supplied behavioural baseline. The system detected ${parts.join(', ')}. The combination of these signals produced a prototype risk score of ${risk}/100.`;
 const id=uid();
 const inc={id,user:t.name,dept:t.dept||'—',
  threat:risk>=70?'Possible Insider Data Exfiltration':risk>=40?'Suspicious Access Pattern':'Low-Risk Session Variance',
  risk,status:'Open',source:'live',anomalies,explanation,
  timeline:[[nowTime(),'Live session submitted for analysis',''],[nowTime(),'Baseline comparison executed',''],
   [nowTime(),anomalies.length?`${anomalies.length} anomaly indicator(s) detected`:'No anomaly indicators detected',anomalies.length?'crit':''],
   [nowTime(),`Prototype risk score calculated: ${risk}/100`,risk>=70?'crit':'']]};
 state.incidents.unshift(inc);
 state.activeIncidentId=id;
 state.liveResult={risk,factors,explanation,anomalies,resource:t.curResource};
 addAudit('Live session analyzed',risk,'Threat assessment generated','SENTINEL-X AI','Completed');
 addEvent(t.id,'Live Test Session Submitted',t.curResource,t.curDevice,t.curLocation,riskClass(risk));
}

   ${field('Employee Name','name')}${field('Employee ID','id')}
   ${field('Department','dept','select',['Finance','HR','Engineering','Marketing','Operations','IT','Sales','Legal'])}
   ${field('Role','role')}
  </div>
  <div class="fsection">Behavioural Baseline</div>
  <div class="fgrid">
   ${field('Normal Login Start','baseStart','time')}${field('Normal Login End','baseEnd','time')}
   ${field('Normal Location','baseLocation','select',['Delhi','Bengaluru','Pune','Hyderabad','Chennai','Gurugram','Noida'])}
   ${field('Normal Device','baseDevice','select',['Windows-Laptop-07','MacBook-Air-14','MacBook-Pro-16','ThinkPad-E14','Dell-Latitude-9'])}
   ${field('Average Daily Activity (events/day)','baseActivity','number')}
   ${field('Average Daily Download (MB)','baseDownload','number')}
  </div>
  <div class="fsection">Current Session</div>
  <div class="fgrid">
   ${field('Current Login Time','curLogin','time')}
   ${field('Current Location','curLocation','select',['Delhi','Bengaluru','Pune','Hyderabad','Chennai','Gurugram','Noida','Mumbai','Unrecognized IP'])}
   ${field('Current Device','curDevice','select',['Windows-Laptop-07','MacBook-Air-14','MacBook-Pro-16','ThinkPad-E14','Dell-Latitude-9','Unknown Device'])}
   ${field('Current Activity Count (events)','curActivity','number')}
   ${field('Current Data Download (MB)','curDownload','number')}
   ${field('Resource Accessed','curResource','select',RESOURCES)}
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">

   <button class="btn ghost" onclick="resetTest()">↺ RESET TEST</button>
  </div>
  <div class="footnote">Prototype Risk Score — Demonstration Model. Not a scientifically validated ML system.</div>
 </div>
 ${r?`
 <div class="card" style="margin-top:16px">
  <h3>Threat Analysis</h3>
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
   <div><span class="riskbig" style="font-size:36px;color:var(--${riskClass(r.risk)==='critical'?'crit':riskClass(r.risk)==='elevated'?'warn':'ok'})">${r.risk}</span><span style="color:var(--sub)">/100</span></div>
   <span class="badge ${riskClass(r.risk)}">${riskClass(r.risk)==='critical'?'CRITICAL':riskClass(r.risk)==='elevated'?'ELEVATED':'LOW'}</span>
  </div>
  ${r.factors.length?`<div class="factorgrid">${r.factors.map(f=>`<div class="factorcard"><div class="ic">${f.ic}</div><b>${f.t}</b>
    <div class="fc-row">Current: ${f.cur}</div><div class="fc-row">Baseline: ${f.base}</div>${f.extra?`<div class="fc-row">Deviation: ${f.extra}</div>`:''}</div>`).join('')}</div>`
   :`<div class="footnote" style="margin-top:10px">No anomaly factors were triggered by the entered session.</div>`}
  <h3 style="margin-top:14px">AI Explanation</h3>
  <div class="explain">${r.explanation}</div>
  <h3 style="margin-top:14px">Detection Pipeline</h3>
  <div class="pipeline">${['USER INPUT','BEHAVIOURAL BASELINE','ANOMALY DETECTION','RISK ANALYSIS','AI EXPLANATION','DEFENSE RECOMMENDATION'].map(s=>`<span class="pnode done">✓ ${s}</span>`).join('<span class="arrow">→</span>')}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
   <button class="btn primary" onclick="switchPage('investigation')">🔎 OPEN INVESTIGATION</button>
   <button class="btn" onclick="switchPage('defense')">Autonomous Defense →</button>
  </div>
 </div>`:''}`;
}

const demoScript=[
 {log:'Employee logs in normally (rahul.k, Delhi, Windows-Laptop-07)',fn:()=>addEvent('rahul.k','Login','HR Portal','Windows-Laptop-07','Delhi','normal')},
 {log:'Employee accesses normal resources',fn:()=>addEvent('rahul.k','Accessed HR Portal','HR Portal','Windows-Laptop-07','Delhi','normal')},
 {log:'⚠ Login occurs at unusual time (02:17 AM)',fn:()=>addEvent('rahul.k','Login (off-hours)','Payroll Database','Windows-Laptop-07','Delhi','elevated')},
 {log:'⚠ New, unrecognized device appears',fn:()=>addEvent('rahul.k','Device fingerprint mismatch','Payroll Database','Unknown Device','Mumbai','elevated')},
 {log:'⚠ Sensitive database (Payroll) accessed',fn:()=>addEvent('rahul.k','Accessed Payroll Database','Payroll Database','Unknown Device','Mumbai','elevated')},
 {log:'🚨 Large data transfer begins (2.8 GB)',fn:()=>addEvent('rahul.k','Bulk Download (2.8GB)','Payroll Database','Unknown Device','Mumbai','critical')},
 {log:'AI detects anomaly cluster',fn:()=>{}},
 {log:'Risk score increasing: 34 → 61 → 92',fn:()=>{}},
 {log:'🚨 Alert escalated to CRITICAL — Incident #SX-2048',fn:()=>{rahulIncident.status='Open';state.activeThreats++;}},
 {log:'AI recommends containment (identity re-verify, restrict access, revoke session)',fn:()=>{}},
 {log:'Simulated response executed — CONTAINMENT SIMULATED',fn:()=>{rahulIncident.status='Contained';state.autoResponses++;addAudit('Containment simulated',92,'Session restricted, evidence preserved','Sentinel-X (simulated)','Completed');}},
 {log:'✓ Audit trail updated with response record',fn:()=>{}}
];
function pageDemo(){
 return `
 <div class="topbar"><div><h2>Demo Mode</h2><div class="desc">Full end-to-end attack scenario for live judge demonstration.</div></div></div>
 <div class="card">
  <div class="demobar">
   <button class="btn primary" ${state.demoRunning?'disabled':''} onclick="runDemo()">▶ RUN THREAT SIMULATION</button>
   <button class="btn" onclick="resetDemo()">↺ RESET DEMO</button>
   <span class="tag">Step ${state.demoStep}/${demoScript.length}</span>
  </div>
  <div class="progress-outer"><div class="progress-inner" style="width:${state.demoStep/demoScript.length*100}%"></div></div>
  <div class="demolog" id="demolog">${state.demoLog?state.demoLog.map((l,i)=>`<div class="${i===state.demoLog.length-1?'cur':''}">[${l.t}] ${l.text}</div>`).join(''):'<div style="color:var(--sub)">Press RUN THREAT SIMULATION to begin the scripted scenario — attack progression, detection, risk scoring and simulated response will play out live across the dashboard.</div>'}</div>
 </div>`;
}
function runDemo(){
 if(state.demoRunning)return;
 state.activeIncidentId='SX-2048';
 state.demoRunning=true;state.demoStep=0;state.demoLog=[];render();
 const step=()=>{
  if(state.demoStep>=demoScript.length){state.demoRunning=false;render();return;}
  const s=demoScript[state.demoStep];s.fn();
  state.demoLog.push({t:nowTime(),text:s.log});
  state.demoStep++;render();
  setTimeout(step,1100);
 };
 setTimeout(step,400);
}
function resetDemo(){
 state.demoRunning=false;state.demoStep=0;state.demoLog=[];
 rahulIncident.status='Open';state.activeThreats=4;state.activeIncidentId='SX-2048';
 seedEvents();render();
}

const PAGES={dashboard:pageDashboard,livetest:pageLiveTest,activity:pageActivity,behaviour:pageBehaviour,risk:pageRisk,
 investigation:pageInvestigation,defense:pageDefense,audit:pageAudit,users:pageUsers,analytics:pageAnalytics,demo:pageDemo};

function render(){
 renderNav();
 document.getElementById('pages').innerHTML=`<div class="page active">${PAGES[currentPage]()}</div>`;
}
render();
